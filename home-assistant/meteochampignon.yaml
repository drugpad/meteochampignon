# Paquet Home Assistant « Météochampignon » — à placer dans <config>/packages/
# (voir home-assistant/install.ps1 et docs/home-assistant.md).
#
# Ce que fait ce fichier :
#   1. DÉCLENCHE les deux traitements GitHub Actions toutes les 15 min
#      (le cron natif de GitHub n'en lance que ~10 à 30 % : voir CLAUDE.md) ;
#   2. SURVEILLE le résultat : fraîcheur des cartes et des stations, dernier
#      traitement de chaque workflow ;
#   3. ALERTE (notification persistante) si quelque chose est en retard ou en
#      échec pendant plus de 15 min ;
#   4. fournit un script « Lancer maintenant » (bouton du tableau de bord).
#
# Prérequis : Home Assistant 2024.10 ou plus récent (syntaxe "triggers:" / "actions:" et
# réponses de rest_command), et dans secrets.yaml :
#   github_dispatch_auth: "Bearer github_pat_XXXX"
# (jeton GitHub fine-grained limité au dépôt, permission Actions : lecture et
# écriture — le script install.ps1 l'ajoute pour vous).

# ----------------------------------------------------------------------------
# 1) Appels vers l'API GitHub (déclenchement des workflows)
# ----------------------------------------------------------------------------
rest_command:
  meteochampignon_stations:
    url: "https://api.github.com/repos/drugpad/meteochampignon/actions/workflows/station-history.yml/dispatches"
    method: POST
    headers:
      Authorization: !secret github_dispatch_auth
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: "home-assistant-meteochampignon"
      Content-Type: "application/json"
    payload: '{"ref":"master"}'
    timeout: 20

  # Cartes : le garde-fou d'âge (50 min) du workflow évite les générations
  # inutiles quand HA appelle toutes les 15 min.
  meteochampignon_cartes:
    url: "https://api.github.com/repos/drugpad/meteochampignon/actions/workflows/maps.yml/dispatches"
    method: POST
    headers:
      Authorization: !secret github_dispatch_auth
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: "home-assistant-meteochampignon"
      Content-Type: "application/json"
    payload: '{"ref":"master"}'
    timeout: 20

  # Cartes avec force=true : ignore le garde-fou d'âge (bouton « Lancer maintenant »).
  meteochampignon_cartes_force:
    url: "https://api.github.com/repos/drugpad/meteochampignon/actions/workflows/maps.yml/dispatches"
    method: POST
    headers:
      Authorization: !secret github_dispatch_auth
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: "home-assistant-meteochampignon"
      Content-Type: "application/json"
    payload: '{"ref":"master","inputs":{"force":"true"}}'
    timeout: 20

# ----------------------------------------------------------------------------
# 2) Capteurs de suivi (lecture, toutes les 5 min)
#    GitHub sans jeton = 60 requêtes/heure ; avec le jeton = 5000/heure.
# ----------------------------------------------------------------------------
rest:
  # --- Fraîcheur réelle des cartes (fichier publié par le traitement) ---
  - resource: "https://raw.githubusercontent.com/drugpad/meteochampignon/data/maps.json"
    scan_interval: 300
    sensor:
      - name: "Meteochampignon cartes generation"
        unique_id: meteochampignon_cartes_generation
        device_class: timestamp
        value_template: "{{ as_datetime(value_json.fetchedAt) }}"
      - name: "Meteochampignon cartes jours"
        unique_id: meteochampignon_cartes_jours
        unit_of_measurement: "jours"
        value_template: "{{ value_json.forecast | length }}"
      - name: "Meteochampignon cartes heures 24h"
        unique_id: meteochampignon_cartes_heures_24h
        unit_of_measurement: "h"
        value_template: "{{ value_json.rain24h.hours }}"

  # --- Dernier traitement « Cartes de pluie » ---
  - resource: "https://api.github.com/repos/drugpad/meteochampignon/actions/workflows/maps.yml/runs?per_page=1"
    scan_interval: 300
    headers:
      Authorization: !secret github_dispatch_auth
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: "home-assistant-meteochampignon"
    sensor:
      - name: "Meteochampignon cartes traitement"
        unique_id: meteochampignon_cartes_traitement
        value_template: >
          {% if value_json.workflow_runs | length > 0 %}
            {% set r = value_json.workflow_runs[0] %}
            {{ r.conclusion if r.status == 'completed' else r.status }}
          {% else %}inconnu{% endif %}
        json_attributes_path: "$.workflow_runs[0]"
        json_attributes:
          - event
          - run_number
          - html_url
          - created_at
      - name: "Meteochampignon cartes traitement date"
        unique_id: meteochampignon_cartes_traitement_date
        device_class: timestamp
        value_template: >
          {% if value_json.workflow_runs | length > 0 %}{{ as_datetime(value_json.workflow_runs[0].created_at) }}{% endif %}

  # --- Dernier traitement « Historique des stations » ---
  - resource: "https://api.github.com/repos/drugpad/meteochampignon/actions/workflows/station-history.yml/runs?per_page=1"
    scan_interval: 300
    headers:
      Authorization: !secret github_dispatch_auth
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: "home-assistant-meteochampignon"
    sensor:
      - name: "Meteochampignon stations traitement"
        unique_id: meteochampignon_stations_traitement
        value_template: >
          {% if value_json.workflow_runs | length > 0 %}
            {% set r = value_json.workflow_runs[0] %}
            {{ r.conclusion if r.status == 'completed' else r.status }}
          {% else %}inconnu{% endif %}
        json_attributes_path: "$.workflow_runs[0]"
        json_attributes:
          - event
          - run_number
          - html_url
          - created_at
      - name: "Meteochampignon stations traitement date"
        unique_id: meteochampignon_stations_traitement_date
        device_class: timestamp
        value_template: >
          {% if value_json.workflow_runs | length > 0 %}{{ as_datetime(value_json.workflow_runs[0].created_at) }}{% endif %}

  # --- Dernière donnée de stations réellement enregistrée (dernier commit
  #     du fichier d'historique : il n'y a de commit que s'il y a du neuf) ---
  - resource: "https://api.github.com/repos/drugpad/meteochampignon/commits?path=public/station-history.json&per_page=1"
    scan_interval: 300
    headers:
      Authorization: !secret github_dispatch_auth
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: "home-assistant-meteochampignon"
    sensor:
      - name: "Meteochampignon stations donnees"
        unique_id: meteochampignon_stations_donnees
        device_class: timestamp
        value_template: "{{ as_datetime(value_json[0].commit.committer.date) }}"

# ----------------------------------------------------------------------------
# 3) Voyants de problème
# ----------------------------------------------------------------------------
template:
  - binary_sensor:
      # Cartes pas régénérées depuis plus de 3 h (ou source injoignable).
      - name: "Meteochampignon cartes en retard"
        unique_id: meteochampignon_cartes_en_retard
        device_class: problem
        state: >
          {% set s = states('sensor.meteochampignon_cartes_generation') %}
          {{ s in ['unknown', 'unavailable', ''] or (now() - (s | as_datetime)).total_seconds() > 3 * 3600 }}

      # Pas de nouvelle donnée de stations depuis plus de 3 h.
      - name: "Meteochampignon stations en retard"
        unique_id: meteochampignon_stations_en_retard
        device_class: problem
        state: >
          {% set s = states('sensor.meteochampignon_stations_donnees') %}
          {{ s in ['unknown', 'unavailable', ''] or (now() - (s | as_datetime)).total_seconds() > 3 * 3600 }}

      # Un des deux traitements a échoué à son dernier passage.
      - name: "Meteochampignon traitement en echec"
        unique_id: meteochampignon_traitement_en_echec
        device_class: problem
        state: >
          {{ 'failure' in [states('sensor.meteochampignon_cartes_traitement'),
                           states('sensor.meteochampignon_stations_traitement')] }}

      # Synthèse : vrai si l'un des trois voyants est allumé.
      - name: "Meteochampignon probleme"
        unique_id: meteochampignon_probleme
        device_class: problem
        state: >
          {{ is_state('binary_sensor.meteochampignon_cartes_en_retard', 'on')
             or is_state('binary_sensor.meteochampignon_stations_en_retard', 'on')
             or is_state('binary_sensor.meteochampignon_traitement_en_echec', 'on') }}

# ----------------------------------------------------------------------------
# 4) Automatisations et script
# ----------------------------------------------------------------------------
automation:
  - id: meteochampignon_declencher_jobs
    alias: "Météochampignon - déclencher les traitements GitHub"
    description: "Toutes les 15 min : lance le traitement des stations et celui des cartes (garde-fou d'âge côté GitHub). Notifie si GitHub refuse l'appel (jeton expiré, droits)."
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/15"
    actions:
      - action: rest_command.meteochampignon_stations
        response_variable: resp_stations
        continue_on_error: true
      - action: rest_command.meteochampignon_cartes
        response_variable: resp_cartes
        continue_on_error: true
      - if: >
          {{ (resp_stations is not defined or resp_stations.status | int(0) != 204)
             or (resp_cartes is not defined or resp_cartes.status | int(0) != 204) }}
        then:
          - action: persistent_notification.create
            data:
              notification_id: meteochampignon_dispatch
              title: "Météochampignon : GitHub a refusé le déclenchement"
              message: >
                Stations : HTTP {{ resp_stations.status if resp_stations is defined else 'pas de réponse' }}.
                Cartes : HTTP {{ resp_cartes.status if resp_cartes is defined else 'pas de réponse' }}.
                401 = jeton expiré ou mal copié ; 403/404 = le jeton n'a pas « Actions : lecture et écriture » sur le dépôt ;
                422 = nom de branche incorrect. Voir docs/home-assistant.md.
        else:
          - action: persistent_notification.dismiss
            data:
              notification_id: meteochampignon_dispatch

  - id: meteochampignon_alerte_probleme
    alias: "Météochampignon - alerte si retard ou échec"
    description: "Notification persistante si un voyant de problème reste allumé plus de 15 min ; elle disparaît seule au retour à la normale."
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.meteochampignon_probleme
        to: "on"
        for: "00:15:00"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: meteochampignon_probleme
          title: "Météochampignon : traitement en retard ou en échec"
          message: >
            {% if is_state('binary_sensor.meteochampignon_cartes_en_retard', 'on') %}
            - Cartes de pluie pas régénérées depuis plus de 3 h.
            {% endif %}
            {% if is_state('binary_sensor.meteochampignon_stations_en_retard', 'on') %}
            - Aucune nouvelle donnée de stations depuis plus de 3 h.
            {% endif %}
            {% if is_state('binary_sensor.meteochampignon_traitement_en_echec', 'on') %}
            - Un traitement GitHub a échoué : voir l'onglet Actions du dépôt.
            {% endif %}
            Détails : tableau de bord « Météochampignon ».

  - id: meteochampignon_retour_normal
    alias: "Météochampignon - retour à la normale"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.meteochampignon_probleme
        to: "off"
    actions:
      - action: persistent_notification.dismiss
        data:
          notification_id: meteochampignon_probleme

script:
  meteochampignon_lancer_maintenant:
    alias: "Météochampignon - lancer maintenant"
    icon: mdi:play-circle
    description: "Lance les deux traitements tout de suite, en ignorant le garde-fou d'âge des cartes."
    sequence:
      - action: rest_command.meteochampignon_stations
      - action: rest_command.meteochampignon_cartes_force

# ----------------------------------------------------------------------------
# 5) Tableau de bord dédié (mode YAML), fichier dashboards/meteochampignon.yaml
#    Si vous avez déjà une section "lovelace:" avec ses propres "dashboards:",
#    fusionnez à la main au lieu de laisser ce bloc (HA refuse les doublons).
# ----------------------------------------------------------------------------
lovelace:
  dashboards:
    # L'identifiant (= l'adresse /meteo-champignon) DOIT contenir un tiret : exigence de
    # Home Assistant (« Url path needs to contain a hyphen »).
    meteo-champignon:
      mode: yaml
      title: Météochampignon
      icon: mdi:mushroom
      show_in_sidebar: true
      filename: dashboards/meteochampignon.yaml
