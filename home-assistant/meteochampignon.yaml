# Paquet Home Assistant « Météochampignon » — à placer dans <config>/packages/
# (voir home-assistant/install.ps1 et docs/home-assistant.md).
#
# Ce que fait ce fichier :
#   1. DÉCLENCHE les deux traitements GitHub Actions toutes les 15 min
#      (le cron natif de GitHub n'en lance que ~10 à 30 % : voir CLAUDE.md) ;
#   2. SURVEILLE le résultat : fraîcheur des cartes et des stations, dernier
#      traitement de chaque workflow ;
#   3. ALERTE (notification persistante) si quelque chose est en retard ou en
#      échec pendant plus de 15 min ;
#   4. fournit un script « Lancer maintenant » (bouton du tableau de bord).
#
# Prérequis : Home Assistant 2024.10 ou plus récent (syntaxe "triggers:" / "actions:" et
# réponses de rest_command), et dans secrets.yaml :
#   github_dispatch_auth: "Bearer github_pat_XXXX"
# (jeton GitHub fine-grained limité au dépôt, permission Actions : lecture et
# écriture — le script install.ps1 l'ajoute pour vous).

# ----------------------------------------------------------------------------
# 1) Appels vers l'API GitHub (déclenchement des workflows)
# ----------------------------------------------------------------------------
rest_command:
  meteochampignon_stations:
    url: "https://api.github.com/repos/drugpad/meteochampignon/actions/workflows/station-history.yml/dispatches"
    method: POST
    headers:
      Authorization: !secret github_dispatch_auth
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: "home-assistant-meteochampignon"
      Content-Type: "application/json"
    payload: '{"ref":"master"}'
    timeout: 20

  # Cartes : le garde-fou d'âge (50 min) du workflow évite les générations
  # inutiles quand HA appelle toutes les 15 min.
  meteochampignon_cartes:
    url: "https://api.github.com/repos/drugpad/meteochampignon/actions/workflows/maps.yml/dispatches"
    method: POST
    headers:
      Authorization: !secret github_dispatch_auth
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: "home-assistant-meteochampignon"
      Content-Type: "application/json"
    payload: '{"ref":"master"}'
    timeout: 20

  # Cartes avec force=true : ignore le garde-fou d'âge (bouton « Lancer maintenant »).
  meteochampignon_cartes_force:
    url: "https://api.github.com/repos/drugpad/meteochampignon/actions/workflows/maps.yml/dispatches"
    method: POST
    headers:
      Authorization: !secret github_dispatch_auth
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: "home-assistant-meteochampignon"
      Content-Type: "application/json"
    payload: '{"ref":"master","inputs":{"force":"true"}}'
    timeout: 20

# ----------------------------------------------------------------------------
# 1 bis) Scripts Python exécutés PAR Home Assistant (sans passer par GitHub Actions)
#   - stations.py : collecte l'historique des stations (API Météo-France, Python
#     standard, rien à installer) et l'écrit dans le dépôt via l'API GitHub ;
#   - check_env.py : diagnostic (« HA peut-il générer les cartes lui-même ? »).
# Copiés dans /config/meteochampignon/ par install.ps1.
# ----------------------------------------------------------------------------
shell_command:
  meteochampignon_stations_ha: "python3 /config/meteochampignon/stations.py"
  meteochampignon_diag: "python3 /config/meteochampignon/check_env.py"
  meteochampignon_stations_test: "python3 /config/meteochampignon/stations.py --check"
  # Cumuls de pluie 3 jours des stations Infoclimat (réseau StatIC). Historique fourni par l'API
  # OpenData : recalcul complet à chaque passage (pas d'accumulation), ~8 s.
  meteochampignon_infoclimat: "python3 /config/meteochampignon/infoclimat.py"
  meteochampignon_infoclimat_test: "python3 /config/meteochampignon/infoclimat.py --check"
  # Cumuls Netatmo : pas d'historique chez Netatmo, on accumule rain_60min heure par heure (~2 min, détaché
  # car une commande shell de HA est coupée à 60 s). Le cumul 3 jours se remplit sur ~3 jours.
  meteochampignon_netatmo: "python3 /config/meteochampignon/netatmo.py --launch"
  meteochampignon_netatmo_test: "python3 /config/meteochampignon/netatmo.py --check"
  # Cartes de pluie calculées par Home Assistant. Les commandes « --launch » lancent le
  # travail EN ARRIÈRE-PLAN et rendent la main aussitôt (une commande shell de HA est
  # interrompue au bout de 60 s ; le calcul dure 3 à 5 min).
  meteochampignon_deps_install: "python3 /config/meteochampignon/install_deps.py --launch"
  meteochampignon_deps_check: "python3 /config/meteochampignon/install_deps.py --check"
  meteochampignon_cartes_ha: "python3 /config/meteochampignon/maps.py --launch"
  meteochampignon_cartes_ha_force: "python3 /config/meteochampignon/maps.py --launch --force"

# ----------------------------------------------------------------------------
# 2) Capteurs de suivi (lecture, toutes les 5 min)
#    GitHub sans jeton = 60 requêtes/heure ; avec le jeton = 5000/heure.
# ----------------------------------------------------------------------------
rest:
  # --- Fraîcheur réelle des cartes (fichier publié par le traitement) ---
  - resource: "https://raw.githubusercontent.com/drugpad/meteochampignon/data/maps.json"
    scan_interval: 300
    sensor:
      - name: "Meteochampignon cartes generation"
        unique_id: meteochampignon_cartes_generation
        device_class: timestamp
        value_template: "{{ as_datetime(value_json.fetchedAt) }}"
      - name: "Meteochampignon cartes source"
        unique_id: meteochampignon_cartes_source
        value_template: "{{ value_json.generatedBy | default('github-actions') }}"
      - name: "Meteochampignon cartes jours"
        unique_id: meteochampignon_cartes_jours
        unit_of_measurement: "jours"
        value_template: "{{ value_json.forecast | length }}"
      - name: "Meteochampignon cartes heures 24h"
        unique_id: meteochampignon_cartes_heures_24h
        unit_of_measurement: "h"
        value_template: "{{ value_json.rain24h.hours }}"

  # --- Dernier traitement « Cartes de pluie » ---
  - resource: "https://api.github.com/repos/drugpad/meteochampignon/actions/workflows/maps.yml/runs?per_page=1"
    scan_interval: 300
    headers:
      Authorization: !secret github_dispatch_auth
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: "home-assistant-meteochampignon"
    sensor:
      - name: "Meteochampignon cartes traitement"
        unique_id: meteochampignon_cartes_traitement
        value_template: >
          {% if value_json.workflow_runs | length > 0 %}
            {% set r = value_json.workflow_runs[0] %}
            {{ r.conclusion if r.status == 'completed' else r.status }}
          {% else %}inconnu{% endif %}
        json_attributes_path: "$.workflow_runs[0]"
        json_attributes:
          - event
          - run_number
          - html_url
          - created_at
      - name: "Meteochampignon cartes traitement date"
        unique_id: meteochampignon_cartes_traitement_date
        device_class: timestamp
        value_template: >
          {% if value_json.workflow_runs | length > 0 %}{{ as_datetime(value_json.workflow_runs[0].created_at) }}{% endif %}

  # --- Dernier traitement « Historique des stations » ---
  - resource: "https://api.github.com/repos/drugpad/meteochampignon/actions/workflows/station-history.yml/runs?per_page=1"
    scan_interval: 300
    headers:
      Authorization: !secret github_dispatch_auth
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: "home-assistant-meteochampignon"
    sensor:
      - name: "Meteochampignon stations traitement"
        unique_id: meteochampignon_stations_traitement
        value_template: >
          {% if value_json.workflow_runs | length > 0 %}
            {% set r = value_json.workflow_runs[0] %}
            {{ r.conclusion if r.status == 'completed' else r.status }}
          {% else %}inconnu{% endif %}
        json_attributes_path: "$.workflow_runs[0]"
        json_attributes:
          - event
          - run_number
          - html_url
          - created_at
      - name: "Meteochampignon stations traitement date"
        unique_id: meteochampignon_stations_traitement_date
        device_class: timestamp
        value_template: >
          {% if value_json.workflow_runs | length > 0 %}{{ as_datetime(value_json.workflow_runs[0].created_at) }}{% endif %}

  # --- Dernière donnée de stations réellement enregistrée (dernier commit
  #     du fichier d'historique : il n'y a de commit que s'il y a du neuf) ---
  - resource: "https://api.github.com/repos/drugpad/meteochampignon/commits?path=public/station-history.json&per_page=1"
    scan_interval: 300
    headers:
      Authorization: !secret github_dispatch_auth
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: "home-assistant-meteochampignon"
    sensor:
      - name: "Meteochampignon stations donnees"
        unique_id: meteochampignon_stations_donnees
        device_class: timestamp
        value_template: "{{ as_datetime(value_json[0].commit.committer.date) }}"

# ----------------------------------------------------------------------------
# 3) Voyants de problème
# ----------------------------------------------------------------------------
# Charge de la machine de Home Assistant : pour voir si les traitements pèsent dessus.
# (scripts/sysmon.py, lecture de /proc, une mesure par minute)
command_line:
  - sensor:
      name: "Meteochampignon HA cpu"
      unique_id: meteochampignon_ha_cpu
      command: "python3 /config/meteochampignon/sysmon.py cpu"
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:cpu-64-bit
      scan_interval: 60
      command_timeout: 20
  - sensor:
      name: "Meteochampignon HA ram"
      unique_id: meteochampignon_ha_ram
      command: "python3 /config/meteochampignon/sysmon.py ram"
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:memory
      scan_interval: 60
      command_timeout: 20
  - sensor:
      name: "Meteochampignon HA charge"
      unique_id: meteochampignon_ha_charge
      command: "python3 /config/meteochampignon/sysmon.py load"
      state_class: measurement
      icon: mdi:gauge
      scan_interval: 60
      command_timeout: 20

template:
  # Âge des données en minutes (mis à jour chaque minute) : sert aux graphiques et
  # à l'affichage « il y a X min » du tableau de bord.
  - sensor:
      - name: "Meteochampignon cartes age"
        unique_id: meteochampignon_cartes_age
        unit_of_measurement: "min"
        state_class: measurement
        icon: mdi:weather-pouring
        state: >
          {% set s = states('sensor.meteochampignon_cartes_generation') %}
          {% if s not in ['unknown', 'unavailable', ''] %}{{ ((now() - (s | as_datetime)).total_seconds() / 60) | round(0) }}{% endif %}
      - name: "Meteochampignon stations age"
        unique_id: meteochampignon_stations_age
        unit_of_measurement: "min"
        state_class: measurement
        icon: mdi:thermometer
        state: >
          {% set s = states('sensor.meteochampignon_stations_donnees') %}
          {% if s not in ['unknown', 'unavailable', ''] %}{{ ((now() - (s | as_datetime)).total_seconds() / 60) | round(0) }}{% endif %}

  - binary_sensor:
      # Cartes pas régénérées depuis plus de 3 h (ou source injoignable).
      - name: "Meteochampignon cartes en retard"
        unique_id: meteochampignon_cartes_en_retard
        device_class: problem
        state: >
          {% set s = states('sensor.meteochampignon_cartes_generation') %}
          {{ s in ['unknown', 'unavailable', ''] or (now() - (s | as_datetime)).total_seconds() > 3 * 3600 }}

      # Pas de nouvelle donnée de stations depuis plus de 3 h.
      - name: "Meteochampignon stations en retard"
        unique_id: meteochampignon_stations_en_retard
        device_class: problem
        state: >
          {% set s = states('sensor.meteochampignon_stations_donnees') %}
          {{ s in ['unknown', 'unavailable', ''] or (now() - (s | as_datetime)).total_seconds() > 3 * 3600 }}

      # Un des deux traitements a échoué à son dernier passage, ET ce passage date de moins de 3 h.
      # (Le traitement GitHub des stations ne tourne plus qu'en secours : son dernier échec restait
      # sinon affiché pendant des heures, avec un bandeau rouge alors que tout était à jour.)
      - name: "Meteochampignon traitement en echec"
        unique_id: meteochampignon_traitement_en_echec
        device_class: problem
        state: >
          {% set vide = ['unknown', 'unavailable', ''] %}
          {% set cd = states('sensor.meteochampignon_cartes_traitement_date') %}
          {% set sd = states('sensor.meteochampignon_stations_traitement_date') %}
          {{ (is_state('sensor.meteochampignon_cartes_traitement', 'failure') and cd not in vide
                and (now() - (cd | as_datetime)).total_seconds() < 10800)
             or (is_state('sensor.meteochampignon_stations_traitement', 'failure') and sd not in vide
                and (now() - (sd | as_datetime)).total_seconds() < 10800) }}

      # Synthèse : vrai si l'un des trois voyants est allumé.
      - name: "Meteochampignon probleme"
        unique_id: meteochampignon_probleme
        device_class: problem
        state: >
          {{ is_state('binary_sensor.meteochampignon_cartes_en_retard', 'on')
             or is_state('binary_sensor.meteochampignon_stations_en_retard', 'on')
             or is_state('binary_sensor.meteochampignon_traitement_en_echec', 'on') }}

# ----------------------------------------------------------------------------
# 4) Automatisations et script
# ----------------------------------------------------------------------------
automation:
  - id: meteochampignon_declencher_jobs
    alias: "Météochampignon - déclencher GitHub en secours"
    description: "Toutes les 15 min : lance le traitement GitHub des CARTES dès qu'elles ont plus de 55 min (Home Assistant ne peut pas les calculer : son processeur n'a pas AVX2), et celui des STATIONS seulement si Home Assistant n'a rien enregistré depuis plus de 90 min. Notifie si GitHub refuse l'appel (jeton expiré, droits)."
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/15"
    variables:
      # Âge en secondes des dernières données (999999 = capteur indisponible => on considère périmé).
      stations_age: >
        {% set s = states('sensor.meteochampignon_stations_donnees') %}{{ 999999 if s in ['unknown', 'unavailable', ''] else (now() - (s | as_datetime)).total_seconds() }}
      cartes_age: >
        {% set s = states('sensor.meteochampignon_cartes_generation') %}{{ 999999 if s in ['unknown', 'unavailable', ''] else (now() - (s | as_datetime)).total_seconds() }}
    actions:
      - if: "{{ stations_age | float(999999) > 5400 }}"
        then:
          - action: rest_command.meteochampignon_stations
            response_variable: resp_stations
            continue_on_error: true
          - if: "{{ resp_stations is not defined or resp_stations.status | int(0) != 204 }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: meteochampignon_dispatch_stations
                  title: "Météochampignon : GitHub a refusé le déclenchement (stations)"
                  message: >
                    HTTP {{ resp_stations.status if resp_stations is defined else 'pas de réponse' }}.
                    401 = jeton expiré ou mal copié ; 403/404 = le jeton n'a pas « Actions : lecture et écriture » ;
                    422 = nom de branche incorrect. Voir docs/home-assistant.md.
            else:
              - action: persistent_notification.dismiss
                data:
                  notification_id: meteochampignon_dispatch_stations
      # 3300 s = 55 min : le traitement GitHub ignore de lui-même une demande si les cartes ont moins de 50 min.
      - if: "{{ cartes_age | float(999999) > 3300 }}"
        then:
          - action: rest_command.meteochampignon_cartes
            response_variable: resp_cartes
            continue_on_error: true
          - if: "{{ resp_cartes is not defined or resp_cartes.status | int(0) != 204 }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: meteochampignon_dispatch_cartes
                  title: "Météochampignon : GitHub a refusé le déclenchement (cartes)"
                  message: >
                    HTTP {{ resp_cartes.status if resp_cartes is defined else 'pas de réponse' }}.
                    401 = jeton expiré ou mal copié ; 403/404 = le jeton n'a pas « Actions : lecture et écriture » ;
                    422 = nom de branche incorrect. Voir docs/home-assistant.md.
            else:
              - action: persistent_notification.dismiss
                data:
                  notification_id: meteochampignon_dispatch_cartes

  - id: meteochampignon_collecter_stations
    alias: "Météochampignon - collecter les stations (Home Assistant)"
    description: "Collecte directe de l'historique des stations par Home Assistant (indépendante de GitHub Actions) : à :15 et :45 de chaque heure. Chaque passage rattrape toutes les heures manquées des 23 dernières heures et n'écrit que s'il y a du neuf."
    mode: single
    triggers:
      # time_pattern n'accepte PAS une liste (« 15,45 ») : un déclencheur par minute.
      - trigger: time_pattern
        minutes: 15
      - trigger: time_pattern
        minutes: 45
    actions:
      - action: shell_command.meteochampignon_stations_ha
        response_variable: stations_ha
        continue_on_error: true
      - if: "{{ stations_ha is not defined or stations_ha.returncode | int(1) != 0 }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: meteochampignon_collecte_ha
              title: "Météochampignon : la collecte des stations par Home Assistant a échoué"
              message: >
                {{ stations_ha.stdout if stations_ha is defined else 'Pas de réponse.' }}
                Les traitements GitHub restent en secours, donc rien n'est perdu.
                Cause fréquente : le jeton GitHub n'a pas « Contents : lecture et écriture »
                (voir docs/home-assistant.md).
        else:
          - action: persistent_notification.dismiss
            data:
              notification_id: meteochampignon_collecte_ha

  - id: meteochampignon_collecter_infoclimat
    alias: "Météochampignon - collecter Infoclimat (Home Assistant)"
    description: "Cumuls de pluie 3 jours des stations Infoclimat (réseau StatIC), à :20 et :50. Recalcul complet depuis l'API OpenData (clé meteochampignon_infoclimat_token)."
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: 20
      - trigger: time_pattern
        minutes: 50
    actions:
      - action: shell_command.meteochampignon_infoclimat
        response_variable: infoclimat
        continue_on_error: true
      - if: "{{ infoclimat is not defined or infoclimat.returncode | int(1) != 0 }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: meteochampignon_infoclimat
              title: "Météochampignon : la collecte Infoclimat a échoué"
              message: >
                {{ infoclimat.stdout if infoclimat is defined else 'Pas de réponse.' }}
                (clé Infoclimat ou droits GitHub ; voir docs/home-assistant.md)
        else:
          - action: persistent_notification.dismiss
            data:
              notification_id: meteochampignon_infoclimat

  - id: meteochampignon_collecter_netatmo
    alias: "Météochampignon - collecter Netatmo (Home Assistant)"
    description: "Accumule la pluie horaire des stations Netatmo publiques (cumul 3 jours), à :10 de chaque heure. Lancé en arrière-plan (~2 min)."
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: 10
    actions:
      - action: shell_command.meteochampignon_netatmo
        continue_on_error: true

  - id: meteochampignon_alerte_probleme
    alias: "Météochampignon - alerte si retard ou échec"
    description: "Notification persistante si un voyant de problème reste allumé plus de 15 min ; elle disparaît seule au retour à la normale."
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.meteochampignon_probleme
        to: "on"
        for: "00:15:00"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: meteochampignon_probleme
          title: "Météochampignon : traitement en retard ou en échec"
          message: >
            {% if is_state('binary_sensor.meteochampignon_cartes_en_retard', 'on') %}
            - Cartes de pluie pas régénérées depuis plus de 3 h.
            {% endif %}
            {% if is_state('binary_sensor.meteochampignon_stations_en_retard', 'on') %}
            - Aucune nouvelle donnée de stations depuis plus de 3 h.
            {% endif %}
            {% if is_state('binary_sensor.meteochampignon_traitement_en_echec', 'on') %}
            - Un traitement GitHub a échoué : voir l'onglet Actions du dépôt.
            {% endif %}
            Détails : tableau de bord « Météochampignon ».

  - id: meteochampignon_retour_normal
    alias: "Météochampignon - retour à la normale"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.meteochampignon_probleme
        to: "off"
    actions:
      - action: persistent_notification.dismiss
        data:
          notification_id: meteochampignon_probleme

script:
  meteochampignon_diagnostic:
    alias: "Météochampignon - diagnostic Python"
    icon: mdi:stethoscope
    description: "Regarde si Home Assistant peut générer lui-même les cartes de pluie (paquets Python, mémoire, réseau). Ne modifie rien. Résultat dans une notification."
    sequence:
      - action: shell_command.meteochampignon_diag
        response_variable: diag
      - action: persistent_notification.create
        data:
          notification_id: meteochampignon_diagnostic
          title: "Météochampignon : diagnostic Python"
          message: "{{ diag.stdout | replace('\n', '\n\n') if diag is defined else 'Pas de réponse' }}"

  meteochampignon_tester_collecte:
    alias: "Météochampignon - tester la collecte des stations"
    icon: mdi:check-network
    description: "Vérifie, sans rien écrire, que Home Assistant peut collecter les stations : clé Météo-France, lecture de l'historique et permission d'écriture du jeton GitHub. Résultat dans une notification."
    sequence:
      - action: shell_command.meteochampignon_stations_test
        response_variable: test
        continue_on_error: true
      - action: persistent_notification.create
        data:
          notification_id: meteochampignon_test_collecte
          title: "Météochampignon : test de la collecte des stations"
          message: >
            {{ test.stdout if test is defined and test.stdout else 'Pas de réponse.' }}
            {{ test.stderr if test is defined and test.stderr else '' }}

  meteochampignon_installer_dependances:
    alias: "Météochampignon - installer les dépendances des cartes"
    icon: mdi:package-down
    description: "À faire UNE FOIS. Installe s3fs, omfiles… dans /config/meteochampignon/pydeps, à part du Python de Home Assistant (rien n'est modifié dans HA ; retour arrière = supprimer ce dossier)."
    sequence:
      - action: shell_command.meteochampignon_deps_install
      - action: persistent_notification.create
        data:
          notification_id: meteochampignon_deps
          title: "Météochampignon : installation lancée"
          message: "L'installation tourne en arrière-plan (1 à 3 min). Cliquez ensuite sur « Vérifier les dépendances »."

  meteochampignon_verifier_dependances:
    alias: "Météochampignon - vérifier les dépendances des cartes"
    icon: mdi:package-check
    description: "Dit quels paquets sont disponibles pour générer les cartes, sans rien installer."
    sequence:
      - action: shell_command.meteochampignon_deps_check
        response_variable: deps
        continue_on_error: true
      - action: persistent_notification.create
        data:
          notification_id: meteochampignon_deps
          title: "Météochampignon : dépendances des cartes"
          message: "{{ deps.stdout if deps is defined and deps.stdout else 'Pas de réponse' }} {{ deps.stderr if deps is defined and deps.stderr else '' }}"

  meteochampignon_cartes_maintenant:
    alias: "Météochampignon - générer les cartes maintenant (Home Assistant)"
    icon: mdi:weather-pouring
    description: "Lance le calcul des cartes sur Home Assistant tout de suite, en ignorant le garde-fou d'âge. Dure 3 à 5 min ; le résultat se voit dans « Dernière génération » et « Cartes générées par »."
    sequence:
      - action: shell_command.meteochampignon_cartes_ha_force
      - action: persistent_notification.create
        data:
          notification_id: meteochampignon_cartes_ha
          title: "Météochampignon : génération lancée"
          message: "Le calcul tourne en arrière-plan (3 à 5 min). Regardez « Cartes générées par » : il doit passer à home-assistant. En cas d'échec : journal /config/meteochampignon/maps.log et état maps-status.json."

  meteochampignon_lancer_maintenant:
    alias: "Météochampignon - lancer maintenant"
    icon: mdi:play-circle
    description: "Lance les deux traitements tout de suite, en ignorant le garde-fou d'âge des cartes."
    sequence:
      - action: rest_command.meteochampignon_stations
      - action: rest_command.meteochampignon_cartes_force

# ----------------------------------------------------------------------------
# 5) Tableau de bord dédié (mode YAML), fichier dashboards/meteochampignon.yaml
#    Si vous avez déjà une section "lovelace:" avec ses propres "dashboards:",
#    fusionnez à la main au lieu de laisser ce bloc (HA refuse les doublons).
# ----------------------------------------------------------------------------
lovelace:
  dashboards:
    # L'identifiant (= l'adresse /meteo-champignon) DOIT contenir un tiret : exigence de
    # Home Assistant (« Url path needs to contain a hyphen »).
    meteo-champignon:
      mode: yaml
      title: Météochampignon
      icon: mdi:mushroom
      show_in_sidebar: true
      filename: dashboards/meteochampignon.yaml
