name: Rafraîchir la carte de pluie

# Recalcule public/rain-grid.json par TRANCHES (voir scripts/fetch-rain-grid.mjs).
# Vercel redéploie automatiquement sur chaque push (intégration Git native),
# donc le fichier statique servi par l'appli reste à jour sans que le
# navigateur d'un utilisateur ait à recalculer la grille lui-même.
#
# Historique : d'abord un job unique tournant toutes les heures, qui bouclait
# lui-même sur les 6 tranches avec une pause de 5 min entre chacune (~65 min
# de run à chaque fois). Problème découvert en usage réel : ce dépôt est
# PRIVÉ — GitHub Actions n'y est gratuit que jusqu'à 2000 min/mois, et une
# pause `sleep` compte comme du temps facturé au même titre qu'un calcul.
# Un job de ~65 min toutes les heures = ~1560 min/JOUR, largement au-delà du
# quota mensuel en un jour et demi — tous les runs ont fini par échouer
# instantanément ("recent account payments have failed or your spending
# limit needs to be increased", visible dans les annotations du run).
#
# D'où : CHAQUE tranche est maintenant un run séparé et court (~6-8 min, pas
# de pause interne), déclenché par cron toutes les 2h — la tranche à traiter
# se déduit de l'heure UTC courante (SLICE_INDEX = (heure/2) % 6), donnant un
# cycle complet (6 tranches) toutes les 12h. Cron à un intervalle ≥1h : bien
# honoré par GitHub (contrairement à un cron sub-horaire, voir la même
# discussion pour l'historique de ce fichier dans son évolution précédente).
on:
  schedule:
    - cron: '5 */2 * * *'
  workflow_dispatch: {} # déclenchement manuel depuis l'onglet Actions, pratique pour tester

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # ~1800 points/tranche — ~5-6 min de pacing anti rate-limit Open-Meteo,
    # marge large pour les retries (429/5xx) observés en usage réel.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recalculer la tranche de grille
        run: |
          # Cycle de 12h : 6 tranches, une toutes les 2h. HEURE/2 donne
          # 0..11, %6 donne directement l'index de tranche 0..5 (répété
          # deux fois par jour). Déclenchement manuel hors de ces créneaux :
          # calcul toujours valide (résultat dans 0..5), juste pas
          # déterministe par rapport au cycle en cours.
          HEURE=$(date -u +%H)
          SLICE_INDEX=$(( (10#$HEURE / 2) % 6 ))
          echo "Heure UTC=$HEURE -> tranche $SLICE_INDEX"

          # `set -e` (par défaut sur les steps GitHub Actions) tuerait le
          # step entier si le script sort volontairement en erreur (tranche
          # trop dégradée, voir MAX_FAILED_BATCH_RATIO côté script) — ici ça
          # ne concerne qu'un seul run (pas une boucle interne), mais on
          # garde le même contrôle explicite plutôt que de se fier à
          # `git diff` seul pour décider du commit.
          if SLICE_INDEX=$SLICE_INDEX SLICE_COUNT=6 node scripts/fetch-rain-grid.mjs; then
            SCRIPT_OK=1
          else
            SCRIPT_OK=0
            echo "Tranche $SLICE_INDEX abandonnée (trop dégradée) — pas de commit."
          fi

          if [ "$SCRIPT_OK" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/rain-grid.json
            if git diff --staged --quiet; then
              echo "Rien à commit"
            else
              git commit -m "Rafraîchir la carte de pluie 24h (tranche $SLICE_INDEX/5)"
              # `git push` peut être rejeté si master a bougé depuis le
              # checkout (un autre job planifié, un merge de PR) — rebase +
              # retry plutôt qu'abandonner ce run.
              for i in 1 2 3; do
                git push && exit 0
                echo "Push rejeté, rebase et retry ($i/3)…"
                git fetch origin master
                git rebase origin/master
              done
              echo "::error::Push définitivement rejeté"
              exit 1
            fi
          fi
