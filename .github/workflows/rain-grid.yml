name: Rafraîchir la carte de pluie

# Recalcule public/rain-grid.json par TRANCHES (voir scripts/fetch-rain-grid.mjs)
# et commit le résultat s'il a changé. Vercel redéploie automatiquement sur
# chaque push (intégration Git native), donc le fichier statique servi par
# l'appli reste à jour sans que le navigateur d'un utilisateur ait à
# recalculer la grille lui-même.
#
# Découpage en 6 tranches de 10 min (grille complète ~10800 points à 0.03°,
# voir RAIN_GRID_STEP_DEG dans src/lib/config.ts) : un run qui tire toute la
# grille d'affilée (~30-40 min) finissait par échouer de façon persistante
# après ~20-25 min de sollicitation continue auprès d'Open-Meteo (429 qui ne
# se dissipe plus malgré les retries) — un run court (~1800 points, ~5-6 min)
# est le format qui s'est montré fiable. Chaque run ne traite qu'une tranche
# et fusionne son résultat dans le fichier existant (voir fetch-rain-grid.mjs)
# — la grille complète se rafraîchit donc toujours en ~1h, comme avant,
# juste réparti en 6 runs courts au lieu d'un seul run long.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {} # déclenchement manuel depuis l'onglet Actions, pratique pour tester

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # ~1800 points/tranche — ~5-6 min de pacing anti rate-limit Open-Meteo,
    # marge large pour les retries (429/5xx) observés en usage réel.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recalculer la tranche de grille
        run: |
          # Le cron tombe pile sur :00/:10/:20/:30/:40/:50, donc minute/10
          # donne directement l'index de tranche 0..5. Pour un déclenchement
          # manuel (workflow_dispatch) hors de ces créneaux, le calcul reste
          # valide (résultat toujours dans 0..5), juste pas déterministe.
          MINUTE=$(date -u +%M)
          SLICE_INDEX=$(( 10#$MINUTE / 10 ))
          echo "Minute UTC=$MINUTE -> tranche $SLICE_INDEX"
          SLICE_INDEX=$SLICE_INDEX SLICE_COUNT=6 node scripts/fetch-rain-grid.mjs

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/rain-grid.json
          git diff --staged --quiet && echo "Rien à commit" && exit 0
          git commit -m "Rafraîchir la carte de pluie 24h"
          # `git push` peut être rejeté si master a bougé depuis le checkout
          # (un autre push pendant les ~4 min que prend ce job — observé en
          # usage réel avec un merge de PR en même temps qu'un run planifié).
          # Un seul fichier de données modifié par ce job : le rebase ne peut
          # pas entrer en conflit avec un autre contenu, retry avec un
          # rebase à chaque tentative plutôt qu'abandonner le cycle.
          for i in 1 2 3; do
            git push && exit 0
            echo "Push rejeté, rebase et retry ($i/3)…"
            git fetch origin master
            git rebase origin/master
          done
          exit 1
