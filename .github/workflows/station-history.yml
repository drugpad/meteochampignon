name: Accumuler l'historique des stations

# Récupère l'heure courante pour chaque station (public/station-history.json,
# voir scripts/fetch-station-history.mjs) et commit le résultat s'il a
# changé — même principe que rain-grid.yml pour la carte de pluie : l'appli
# lit ce fichier statique au lieu d'appeler l'API Météo-France depuis le
# navigateur au clic sur une station.
#
# Toutes les heures, obligatoirement : `rr1` est la pluie de l'heure
# précédente SEULEMENT, donc échantillonner moins souvent fait passer à côté
# de la plupart des averses (constaté le 03/10/2026 : ~2.8 mm tombés à La
# Mongie dans la journée, 0.8 mm affichés avec un run toutes les 12h).
# Le passage à 12h (incident de facturation, dépôt alors privé) n'a plus
# lieu d'être depuis que le dépôt est public (Actions gratuit illimité).
# Minute 20 : évite la minute 5 de rain-grid.yml et la minute 35 de
# rain-forecast-grid.yml (crons simultanés qui se sautent mutuellement).
on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 239 stations à ~1.7s d'écart ≈ 7 min — marge large pour ne pas timeout.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer l'heure courante pour chaque station
        env:
          METEOFRANCE_API_TOKEN: ${{ secrets.METEOFRANCE_API_TOKEN }}
        run: node scripts/fetch-station-history.mjs

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/station-history.json
          git diff --staged --quiet && echo "Rien à commit" && exit 0
          git commit -m "Accumuler l'historique des stations"
          # Même précaution que rain-grid.yml : un push peut être rejeté si
          # master a bougé pendant les ~7 min que prend ce job (autre push,
          # merge de PR). Un seul fichier de données modifié par ce job :
          # rebase + retry plutôt qu'abandonner le cycle.
          for i in 1 2 3; do
            git push && exit 0
            echo "Push rejeté, rebase et retry ($i/3)…"
            git fetch origin master
            git rebase origin/master
          done
          exit 1
