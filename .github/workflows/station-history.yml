name: Accumuler l'historique des stations

# Collecte l'historique horaire des stations (public/station-history.json,
# voir scripts/fetch-station-history.mjs) et commit le résultat s'il a changé.
#
# AUTO-RÉPARANT, ne dépend plus de la régularité du cron : GitHub n'en
# déclenche qu'environ un tiers (mesuré : 24 sur 72 attendus en 6 jours ; la
# doc dit que les déclenchements peuvent être retardés ou abandonnés). Chaque
# run rattrape donc toutes les heures manquées des 23 dernières heures (limite
# de l'API Paquet), à 1 appel par heure. `rr1` est la pluie de l'heure
# précédente seulement : sans rattrapage, chaque run raté perdait une pluie.
#
# Deux créneaux par heure (:20 et :50) pour multiplier les chances d'un
# déclenchement effectif ; le second ne commit rien s'il n'y a rien de neuf.
# Minutes distinctes de celles des jobs de cartes (voir maps.yml) : des crons
# simultanés se sautent mutuellement sous charge.
on:
  schedule:
    - cron: '20,50 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# Un seul run à la fois : deux runs simultanés fusionneraient en parallèle dans
# le même fichier. Un run en attente est conservé (cancel-in-progress: false).
concurrency:
  group: station-history
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    # 24 appels au plus (~30 s). Marge large pour les retries réseau.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Collecter les heures manquantes (API Paquet)
        env:
          METEOFRANCE_API_TOKEN: ${{ secrets.METEOFRANCE_API_TOKEN }}
          HISTORY_TMP: ${{ runner.temp }}/history-new-points.json
        run: node scripts/fetch-station-history.mjs

      # `always()` : un run interrompu garde ce qu'il a déjà collecté. À chaque
      # tentative, on repart de la dernière version de master (reset) puis on
      # refait la fusion — pas de `git rebase` : le fichier d'historique tient
      # sur une seule ligne, donc toute modification concurrente (rattrapage
      # manuel, autre run) provoquait un conflit et la perte des points de
      # l'heure (voir scripts/merge-station-history.mjs).
      - name: Fusionner et committer
        if: always()
        env:
          HISTORY_TMP: ${{ runner.temp }}/history-new-points.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master
            node scripts/merge-station-history.mjs
            git add public/station-history.json
            git diff --staged --quiet && echo "Rien à commit" && exit 0
            git commit -m "Accumuler l'historique des stations"
            git push && exit 0
            echo "Push rejeté, nouvelle tentative ($i/5)…"
          done
          exit 1
