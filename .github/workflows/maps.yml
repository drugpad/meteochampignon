name: Cartes de pluie

# Génère les cartes de pluie (24h passées + prévisions par jour) avec
# scripts/build-rain-maps.py et les publie sur la branche orpheline "data"
# (écrasée à chaque run : AUCUN historique, donc aucune croissance du dépôt
# malgré des PNG qui changent à chaque fois, et aucun déploiement Vercel
# déclenché — voir vercel.json). L'appli les lit sur raw.githubusercontent.com.
#
# Remplace rain-grid.yml et rain-forecast-grid.yml : ceux-ci interrogeaient
# l'API Open-Meteo point par point (10 922 appels par grille, soit 12 000 à
# 18 000 appels/jour pour une limite gratuite de 10 000, voir CLAUDE.md).
# Ici, les données brutes des modèles sont lues sur le stockage public
# d'Open-Meteo : aucun appel d'API, et 1,5 km de résolution au lieu de 3,3 km.
#
# DÉCLENCHEURS — le cron natif de GitHub n'en déclenche qu'une fraction (9 à
# 33 % mesurés : la doc dit que "schedule" peut être retardé ou abandonné),
# donc trois sources, toutes protégées par le même garde-fou d'âge :
#   1. cron, 6 créneaux par heure (chacun a sa propre chance de partir) ;
#   2. workflow_dispatch appelé de l'extérieur toutes les 15 min (Home
#      Assistant, voir docs/home-assistant.md) — non soumis aux pertes du cron ;
#   3. lancement manuel (input "force" pour ignorer le garde-fou).
# Le garde-fou (moins de 50 min depuis la dernière génération = on ne fait
# rien) borne le travail à ~1 génération par heure quel que soit le nombre de
# déclencheurs. Minutes distinctes de celles du job des stations
# (station-history.yml) : des crons simultanés se sautent mutuellement.
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorer le garde-fou d'âge (régénérer même si les cartes sont récentes)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: maps
  cancel-in-progress: false

jobs:
  build:
    # Image épinglée (pas ubuntu-latest, qui migre vers Ubuntu 26 le 19/10/2026) :
    # une nouvelle image peut casser les roues binaires (omfiles, scipy). À
    # relever volontairement, après un essai manuel (workflow_dispatch).
    runs-on: ubuntu-24.04
    # ~3 min en local, marge large pour le réseau S3.
    timeout-minutes: 15
    steps:
      - name: Garde-fou d'âge
        id: guard
        env:
          FORCE: ${{ inputs.force }}
        run: |
          fetched=$(curl -fsS "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/maps.json" 2>/dev/null | grep -o '"fetchedAt":"[^"]*"' | cut -d'"' -f4 || true)
          skip=false
          if [ -n "$fetched" ] && [ "$FORCE" != "true" ]; then
            age=$(( $(date -u +%s) - $(date -u -d "$fetched" +%s) ))
            echo "Dernière génération : $fetched (il y a ${age}s)"
            if [ "$age" -lt 3000 ]; then skip=true; echo "Cartes récentes : rien à faire."; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-maps.txt

      - run: pip install -r scripts/requirements-maps.txt
        if: steps.guard.outputs.skip != 'true'

      - name: Générer les cartes
        if: steps.guard.outputs.skip != 'true'
        env:
          OUT_DIR: ${{ runner.temp }}/maps-out
        run: python scripts/build-rain-maps.py

      - name: Publier sur la branche data (écrasée)
        if: steps.guard.outputs.skip != 'true'
        env:
          OUT_DIR: ${{ runner.temp }}/maps-out
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$OUT_DIR"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Cartes de pluie $(date -u +%Y-%m-%dT%H:%MZ)"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin data
