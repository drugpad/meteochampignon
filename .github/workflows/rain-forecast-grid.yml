name: Rafraîchir la carte de pluie prévue

# Recalcule public/rain-forecast-grid.json par TRANCHES (voir
# scripts/fetch-rain-forecast-grid.mjs) — même principe que rain-grid.yml
# (carte de pluie 24h mesurée) : un seul cron (bien honoré par GitHub tant
# qu'il reste ≥1h — voir les commentaires détaillés dans rain-grid.yml sur
# la fiabilité du cron natif en dessous de ce seuil) dont le job boucle en
# interne sur les 6 tranches, avec une pause entre chaque pour ne pas
# soutenir une sollicitation continue trop longue auprès d'Open-Meteo.
#
# Différence : toutes les 3h, pas toutes les heures — une prévision change
# beaucoup moins vite qu'un cumul mesuré, pas besoin d'un cycle aussi
# fréquent (voir CACHED_GRID_MAX_AGE_MS, src/lib/rainForecastGrid.ts).
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recalculer les 6 tranches de la grille prévue
        run: |
          for SLICE in 0 1 2 3 4 5; do
            echo "=== Tranche $SLICE/5 ==="
            SLICE_INDEX=$SLICE SLICE_COUNT=6 node scripts/fetch-rain-forecast-grid.mjs

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/rain-forecast-grid.json
            if git diff --staged --quiet; then
              echo "Rien à commit pour cette tranche"
            else
              git commit -m "Rafraîchir la carte de pluie prévue (tranche $SLICE/5)"
              PUSHED=0
              for i in 1 2 3; do
                if git push; then PUSHED=1; break; fi
                echo "Push rejeté, rebase et retry ($i/3)…"
                git fetch origin master
                git rebase origin/master
              done
              if [ "$PUSHED" != "1" ]; then
                echo "::error::Push définitivement rejeté pour la tranche $SLICE"
                exit 1
              fi
            fi

            if [ "$SLICE" != "5" ]; then
              echo "Pause avant la tranche suivante…"
              sleep 300
            fi
          done
