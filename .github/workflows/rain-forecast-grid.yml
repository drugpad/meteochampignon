name: Rafraîchir la carte de pluie prévue

# Recalcule public/rain-forecast-grid.json par TRANCHES (voir
# scripts/fetch-rain-forecast-grid.mjs) — voir rain-grid.yml (carte de pluie
# 24h mesurée) pour le raisonnement détaillé, repris ici à l'identique :
# chaque tranche est un run court et séparé (pas de pause interne facturée),
# déclenché par cron toutes les 2h — la tranche à traiter se déduit de
# l'heure UTC courante, donnant un cycle complet (6 tranches) toutes les 12h.
#
# Coût GitHub Actions (dépôt privé, 2000 min/mois gratuites) : une
# précédente version (un seul job/heure bouclant en interne sur les 6
# tranches avec pause `sleep`, ~65 min facturées à chaque fois) a fait
# dépasser le quota mensuel en un jour et demi, bloquant tous les runs du
# dépôt ("recent account payments have failed..."). D'où l'architecture
# ci-dessous, bien moins coûteuse (courts runs espacés par le cron lui-même,
# pas par un sleep facturé).
on:
  schedule:
    - cron: '5 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recalculer la tranche de grille prévue
        run: |
          HEURE=$(date -u +%H)
          SLICE_INDEX=$(( (10#$HEURE / 2) % 6 ))
          echo "Heure UTC=$HEURE -> tranche $SLICE_INDEX"

          if SLICE_INDEX=$SLICE_INDEX SLICE_COUNT=6 node scripts/fetch-rain-forecast-grid.mjs; then
            SCRIPT_OK=1
          else
            SCRIPT_OK=0
            echo "Tranche $SLICE_INDEX abandonnée (trop dégradée) — pas de commit."
          fi

          if [ "$SCRIPT_OK" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/rain-forecast-grid.json
            if git diff --staged --quiet; then
              echo "Rien à commit"
            else
              git commit -m "Rafraîchir la carte de pluie prévue (tranche $SLICE_INDEX/5)"
              for i in 1 2 3; do
                git push && exit 0
                echo "Push rejeté, rebase et retry ($i/3)…"
                git fetch origin master
                git rebase origin/master
              done
              echo "::error::Push définitivement rejeté"
              exit 1
            fi
          fi
